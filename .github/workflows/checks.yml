name: Sales learning checks (local demo)
on:
  push:
  pull_request:
jobs:
  sales:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '26', cache: 'npm' }
      - run: npm ci
      - name: Install Google Chrome and system dependencies
        run: npx playwright install --with-deps chrome
      - name: Type check
        run: npm run test:syntax
      - name: Unit and verification tests
        run: npm run test:unit
      - name: AWS orchestration verification (no AWS calls)
        run: npm run aws-sales:verify && npm run aws-sales:list
      - name: List seven scenarios
        run: npm run test:list
      - name: Local Chrome scenarios (unconfirmed is nonzero)
        run: npm run test:integration
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '26', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17', cache: 'maven' }
      - run: npm ci
      - name: Install Google Chrome and system dependencies
        run: npx playwright install --with-deps chrome
      - name: Java local tests and seven scenarios (unconfirmed is nonzero)
        working-directory: java
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
        run: ./mvnw -B test
